name: Publication GitHub Pages

# Publie le widget et le JSON sur GitHub Pages pour pouvoir les intégrer
# sur n'importe quel site (WordPress, Wix, site maison…).
# À activer une fois : Settings > Pages > Source : "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["widget/**", "data/**"]
  # Lancé aussi par « Classement D2 », uniquement quand le classement change.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r widget _site/widget
          cp -r data _site/data 2>/dev/null || true
          cp widget/index.html _site/index.html
          sed -i 's#src="classement.js"#src="widget/classement.js"#' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      # GitHub ne voit parfois pas tout de suite le paquet qui vient d'être
      # déposé (« No artifacts named github-pages ») : on réessaie une fois.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Attendre avant un nouvel essai
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
