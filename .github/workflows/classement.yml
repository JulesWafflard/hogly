name: Classement D2

on:
  schedule:
    # Toutes les 3 heures, et toutes les 30 minutes les soirs de match
    # (vendredi, samedi, dimanche entre 18h et minuit, heure de Paris ≈ UTC+1/+2).
    - cron: "17 */3 * * *"
    - cron: "*/30 16-23 * * 5,6,0"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: classement
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Récupérer le classement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run classement
          code=$?
          set -e
          # 75 = site de la FFHG momentanément indisponible (403, 503, réseau…).
          # On ne fait échouer le workflow (et envoyer un e-mail) que si le
          # dernier succès date de plus de 24 h.
          if [ "$code" -eq 75 ]; then
            last=$(gh run list --workflow classement.yml --status success --limit 1 \
              --json createdAt --jq '.[0].createdAt // empty')
            age=$(( $(date +%s) - $(date -d "${last:-1970-01-01}" +%s) ))
            if [ "$age" -lt 86400 ]; then
              echo "::warning::Site de la FFHG momentanément indisponible, nouvel essai à la prochaine exécution."
              exit 0
            fi
            echo "::error::Le site de la FFHG refuse l'accès depuis plus de 24 h."
          fi
          exit "$code"
      - name: Publier le classement s'il a changé
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "Rien à publier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mise à jour du classement D2"
          git push
